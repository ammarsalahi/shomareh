[package]
name = "shomareh"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Ammar salahi <ammarsaalahi@gmail.com"]
description = "Persian utilities: Jalali/Gregorian date conversion and phone/email validation with Persian digit support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ammarsalahi/shomareh"
homepage = "https://github.com/ammarsalahi/shomareh"
keywords = ["jalali", "persian", "datetime", "validation", "phone"]
categories = ["date-and-time", "validation"]
readme = "README.md"

[dependencies]
chrono = "0.4.44"
csv = "1.4.0"
regex = "1.12.3"
serde = { version = "1.0", features = ["derive"] }

[lib]
name = "shomareh"
path = "src/lib.rs"
test = true
doctest = true
bench = true
doc = true
proc-macro = false
crate-type = ["lib"]
required-features = []
